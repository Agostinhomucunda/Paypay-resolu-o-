<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>PayPay Ganha | Acesso Seguro</title>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 25px;">

    <div style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://i.postimg.cc/G2K2SCFQ/C9541CCF_3AD6_4F7A_9CEA_33F2F300A8FB.jpg" width="90" style="border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
            <h1 style="margin-top: 20px; font-weight: 900; font-size: 28px; letter-spacing: -1px;">PayPay <span style="color: var(--paypay);">Ganha</span></h1>
            <p style="color: var(--text-dim); font-size: 14px;">A elite dos investimentos em Angola.</p>
        </div>

        <div class="premium-card">
            <div id="auth-box">
                <input type="text" id="reg-nome" placeholder="Nome Completo" class="ultra-input" style="display: none;">
                <input type="email" id="email" placeholder="Endereço de Email" class="ultra-input">
                <input type="password" id="password" placeholder="Palavra-passe" class="ultra-input">
                
                <button id="main-btn" class="btn-main">ENTRAR NO SISTEMA</button>
                
                <p id="toggle-form" style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-dim); cursor: pointer;">
                    Novo por aqui? <span style="color: var(--paypay); font-weight: 700;">Criar Conta Digital</span>
                </p>
            </div>
        </div>

        <div style="text-align: center; margin-top: 40px; opacity: 0.4; font-size: 11px;">
            <p><i class="fa-solid fa-shield-halved"></i> Parceria Oficial Unitel & Africel</p>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
