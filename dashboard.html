<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Dashboard | PayPay Ganha</title>
</head>
<body style="padding: 20px; padding-bottom: 120px;">

    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div id="user-rank-icon" style="width: 50px; height: 50px; border-radius: 15px; background: var(--glass); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);">
                <i class="fa-solid fa-medal" style="font-size: 24px;"></i>
            </div>
            <div>
                <h4 id="user-name" style="font-weight: 800; font-size: 18px;">...</h4>
                <div id="rank-badge" class="badge-rank rank-cadete">Carregando Rank...</div>
            </div>
        </div>
        <div onclick="location.href='perfil.html'" style="font-size: 24px; opacity: 0.7;"><i class="fa-solid fa-user-gear"></i></div>
    </header>

    <div class="premium-card" style="background: linear-gradient(135deg, rgba(0,200,83,0.15) 0%, rgba(255,255,255,0.02) 100%);">
        <p style="font-size: 11px; letter-spacing: 2px; opacity: 0.6; font-weight: 700;">SALDO DISPONÍVEL</p>
        <h1 id="saldo-txt" style="font-size: 40px; font-weight: 900; margin: 10px 0;">0,00 Kz</h1>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <div style="flex: 1; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 18px; border: 1px solid var(--border);">
                <p style="font-size: 9px; color: var(--text-dim);">EM RENDIMENTO</p>
                <p id="investido-txt" style="font-weight: 800; color: var(--paypay);">0 Kz</p>
            </div>
            <div style="flex: 1; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 18px; border: 1px solid var(--border); text-align: center;">
                <p style="font-size: 9px; color: var(--text-dim);">PONTOS ARCADE</p>
                <p id="pontos-txt" style="font-weight: 800; color: var(--africel);">0 pts</p>
                <button onclick="location.href='recargas.html'" class="btn-troca">TROCAR</button>
            </div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 30px; text-align: center;">
        <div onclick="location.href='investir.html'"><div class="premium-card" style="padding: 15px; border-radius: 20px;"><i class="fa-solid fa-arrow-trend-up" style="color: var(--paypay);"></i></div><p style="font-size: 10px; margin-top: 8px;">Investir</p></div>
        <div onclick="location.href='jogos.html'"><div class="premium-card" style="padding: 15px; border-radius: 20px;"><i class="fa-solid fa-gamepad" style="color: var(--africel);"></i></div><p style="font-size: 10px; margin-top: 8px;">Jogos</p></div>
        <div onclick="location.href='videos.html'"><div class="premium-card" style="padding: 15px; border-radius: 20px;"><i class="fa-solid fa-play" style="color: #ff4444;"></i></div><p style="font-size: 10px; margin-top: 8px;">Vídeos</p></div>
        <div onclick="location.href='saque.html'"><div class="premium-card" style="padding: 15px; border-radius: 20px;"><i class="fa-solid fa-wallet"></i></div><p style="font-size: 10px; margin-top: 8px;">Saque</p></div>
    </div>

    <div class="premium-card" onclick="location.href='tutorial.html'" style="margin-top: 30px; display: flex; align-items: center; justify-content: space-between; background: var(--glass);">
        <div>
            <h4 style="font-size: 14px;">Como funciona a plataforma?</h4>
            <p style="font-size: 11px; color: var(--text-dim);">Aprenda a lucrar com gestos simples.</p>
        </div>
        <i class="fa-solid fa-chevron-right" style="opacity: 0.3;"></i>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="location.href='investir.html'"><i class="fa-solid fa-chart-pie"></i></div>
        <div class="nav-item" onclick="location.href='jogos.html'"><i class="fa-solid fa-circle-play"></i></div>
        <div class="nav-item" onclick="location.href='perfil.html'"><i class="fa-solid fa-user"></i></div>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
