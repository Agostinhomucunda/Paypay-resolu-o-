<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Finalizar Pagamento | PayPay Ganha</title>
</head>
<body style="padding: 20px;">

    <div style="text-align: center; margin: 20px 0;">
        <h2 style="font-weight: 900;">Pagamento Seguro</h2>
        <p style="font-size: 12px; color: var(--paypay);">Plano: <span id="plano-nome">...</span></p>
    </div>

    <div class="premium-card" style="text-align: center; border-color: #ff4444; margin-bottom: 20px; padding: 15px;">
        <p style="font-size: 10px; font-weight: 800; color: #ff4444;">EXPIRA EM: <span id="timer">04:00</span></p>
    </div>

    <div class="premium-card" style="margin-bottom: 25px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span style="font-size: 11px; opacity: 0.6;">DADOS PARA DEPÓSITO</span>
            <img id="metodo-logo" src="" width="30" style="border-radius: 6px;">
        </div>
        
        <div id="dados-container" style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 18px; border: 1px dashed var(--border); margin-bottom: 20px;">
            </div>

        <div id="intervencao-box" style="padding: 15px; background: rgba(0,200,83,0.05); border-radius: 15px; border: 1px solid rgba(0,200,83,0.1);">
            <p id="instrucoes-texto" style="font-size: 12px; color: var(--paypay); font-weight: 700; line-height: 1.6;"></p>
        </div>
    </div>

    <div class="premium-card" style="text-align: center;">
        <h4 style="font-size: 14px; margin-bottom: 15px;">Anexar Comprovativo</h4>
        
        <input type="file" id="file-input" accept="image/*" style="display: none;">
        
        <button id="btn-biometria" onclick="document.getElementById('file-input').click()" class="btn-main" style="background: var(--surface); border: 2px dashed var(--paypay); color: #fff; margin-bottom: 15px; padding: 15px;">
            <i class="fa-solid fa-fingerprint" style="color: var(--paypay);"></i> SELECIONAR COMPROVATIVO
        </button>

        <p id="file-status" style="font-size: 10px; color: var(--paypay); margin-bottom: 15px; display: none; font-weight: 800;">✓ IMAGEM CARREGADA</p>

        <button id="btn-finalizar" class="btn-main" style="opacity: 0.4;" disabled>
            FINALIZAR INVESTIMENTO
        </button>
    </div>

    <script type="module">
        import { auth, db, storage } from "./firebase.js";
        import { ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. Configurar Instruções baseadas no método escolhido
        const metodo = localStorage.getItem('metodo_pagamento');
        const plano = localStorage.getItem('plano_n');
        document.getElementById('plano-nome').innerText = plano;

        const dadosBox = document.getElementById('dados-container');
        const instrucoes = document.getElementById('instrucoes-texto');
        const logo = document.getElementById('metodo-logo');

        if (metodo === 'paypay') {
            logo.src = "https://i.postimg.cc/G2K2SCFQ/C9541CCF_3AD6_4F7A_9CEA_33F2F300A8FB.jpg";
            dadosBox.innerHTML = `<p style="font-size:11px; opacity:0.6;">Número PayPay</p><h2 style="color:var(--paypay)">951 875 350</h2>`;
            instrucoes.innerHTML = "ABRA O SEU PAYPAY<br>VÁ EM TRANSFERIR<br>DIGITE O NÚMERO ACIMA<br>CONFIRME O VALOR E ENVIE O COMPROVANTE.";
        } else {
            logo.src = "https://i.postimg.cc/SstS2pq6/multicaixa-express.png";
            dadosBox.innerHTML = `
                <p style="font-size:11px; opacity:0.6;">Entidade: <b style="color:#fff">10116</b></p>
                <p style="font-size:11px; opacity:0.6;">Referência: <b style="color:#fff">951 875 350</b></p>
            `;
            instrucoes.innerHTML = "ABRA O SEU MULTICAIXA EXPRESS<br>VÁ EM PAGAMENTOS<br>PAGAMENTO POR REFERÊNCIA<br>ENTIDADE: 10116<br>REFERÊNCIA: 951875350<br>VALOR: (DIGITE O VALOR DO PLANO)<br>PROSSEGUIR.";
        }

        // 2. Lógica do Botão de Finalizar
        const fileInput = document.getElementById('file-input');
        const btnFinalizar = document.getElementById('btn-finalizar');
        const fileStatus = document.getElementById('file-status');

        fileInput.onchange = (e) => {
            if(e.target.files.length > 0) {
                fileStatus.style.display = "block";
                btnFinalizar.disabled = false;
                btnFinalizar.style.opacity = "1";
                document.getElementById('btn-biometria').style.borderColor = "#00c853";
            }
        };

        btnFinalizar.onclick = async () => {
            btnFinalizar.disabled = true;
            btnFinalizar.innerText = "A PROCESSAR...";

            try {
                const file = fileInput.files[0];
                const storageRef = ref(storage, `comprovativos/${auth.currentUser.uid}_${Date.now()}`);
                await uploadBytes(storageRef, file);

                await updateDoc(doc(db, "users", auth.currentUser.uid), {
                    statusInvestimento: "Aguardando Aprovação",
                    planoPendente: plano,
                    dataPedido: serverTimestamp()
                });

                alert("Pedido enviado com sucesso! Aguarde a ativação.");
                window.location.href = "dashboard.html";
            } catch (err) {
                alert("Erro: " + err.message);
                btnFinalizar.disabled = false;
                btnFinalizar.innerText = "TENTAR NOVAMENTE";
            }
        };

        // 3. Timer de 4 minutos
        let timeLeft = 240;
        setInterval(() => {
            if(timeLeft <= 0) return location.href = 'investir.html';
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `0${mins}:${secs < 10 ? '0'+secs : secs}`;
            timeLeft--;
        }, 1000);
    </script>
</body>
</html>
