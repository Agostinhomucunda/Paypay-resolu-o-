<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Pagamento Seguro | PayPay Ganha</title>
</head>
<body style="padding: 20px;">

    <div style="text-align: center; margin: 20px 0 30px 0;">
        <h2 style="font-weight: 900;">Finalizar Investimento</h2>
        <p style="font-size: 12px; color: var(--text-dim);">Siga as instruções para ativar o seu plano <span id="plano-nome" style="color:var(--paypay); font-weight:800;">...</span></p>
    </div>

    <div class="premium-card" style="text-align: center; border-color: #ff4444; margin-bottom: 25px;">
        <p style="font-size: 10px; font-weight: 800; color: #ff4444; letter-spacing: 1px;">ESTA SESSÃO EXPIRA EM</p>
        <h1 id="timer" style="font-size: 42px; font-weight: 900; color: #ff4444; margin: 10px 0;">04:00</h1>
    </div>

    <div class="premium-card" style="background: rgba(255,255,255,0.02); margin-bottom: 25px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span style="font-size: 11px; opacity: 0.6;">DADOS DE DEPÓSITO</span>
            <img id="metodo-logo" src="https://i.postimg.cc/G2K2SCFQ/C9541CCF_3AD6_4F7A_9CEA_33F2F300A8FB.jpg" width="30" style="border-radius: 6px;">
        </div>
        
        <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 18px; border: 1px dashed var(--border); text-align: center;">
            <p style="font-size: 12px; color: var(--text-dim); margin-bottom: 5px;">ID PayPay / Referência</p>
            <h2 id="copy-target" style="font-size: 26px; font-weight: 900; letter-spacing: 1px; color: var(--paypay);">951 875 350</h2>
            <button onclick="copyData()" style="margin-top: 10px; background: var(--glass); border: 1px solid var(--border); color: #fff; padding: 6px 15px; border-radius: 50px; font-size: 10px; cursor: pointer;">
                <i class="fa-solid fa-copy"></i> COPIAR NÚMERO
            </button>
        </div>

        <div style="margin-top: 20px; font-size: 13px;">
            <p>Valor a Transferir: <b id="valor-confirmar" style="color: #fff;">0 Kz</b></p>
            <p style="font-size: 10px; color: var(--text-dim); margin-top: 5px;">*O saldo será creditado após verificação do comprovativo.</p>
        </div>
    </div>

    <div class="premium-card">
        <h4 style="font-size: 14px; margin-bottom: 15px;">Anexar Comprovativo</h4>
        <div style="position: relative;">
            <input type="file" id="file-receipt" class="ultra-input" style="padding-top: 45px; font-size: 12px;">
            <i class="fa-solid fa-cloud-arrow-up" style="position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 20px; opacity: 0.3;"></i>
        </div>
        <button id="btn-finalizar" class="btn-main" style="margin-top: 10px;">
            <i class="fa-solid fa-fingerprint"></i> AUTENTICAR PAGAMENTO
        </button>
    </div>

    <script type="module">
        import { auth, db, storage } from "./firebase.js";
        import { ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { doc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Recuperar dados do plano escolhido
        const valor = localStorage.getItem('plano_v');
        const nomePlano = localStorage.getItem('plano_n');
        document.getElementById('plano-nome').innerText = nomePlano;
        document.getElementById('valor-confirmar').innerText = parseInt(valor).toLocaleString() + " Kz";

        // Timer de 4 minutos
        let timeLeft = 240;
        const timerElement = document.getElementById('timer');
        const countdown = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerElement.innerHTML = `0${minutes}:${seconds}`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                alert("Sessão expirada. Tente novamente.");
                location.href = 'investir.html';
            }
            timeLeft--;
        }, 1000);

        // Função Copiar
        window.copyData = () => {
            navigator.clipboard.writeText("951875350");
            alert("Número copiado para a área de transferência!");
        };

        // Lógica de Finalização
        document.getElementById('btn-finalizar').onclick = async () => {
            const file = document.getElementById('file-receipt').files[0];
            const btn = document.getElementById('btn-finalizar');

            if(!file) return alert("Por favor, anexe a foto do comprovativo.");

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> CRIPTOGRAFANDO...`;

            try {
                // 1. Upload para o Firebase Storage
                const storageRef = ref(storage, `comprovativos/${auth.currentUser.uid}_${Date.now()}`);
                await uploadBytes(storageRef, file);

                btn.innerHTML = `<i class="fa-solid fa-face-smile-beam"></i> BIOMETRIA ACEITA!`;

                // 2. Atualizar dados no Firestore
                // Nota: O saldo só deve subir após o admin aprovar, mas como você pediu pra subir:
                const userRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(userRef, {
                    valorInvestido: increment(parseInt(valor)),
                    investimentoAtivo: true,
                    dataUltimoInvestimento: serverTimestamp(),
                    rank: nomePlano // Atualiza a medalha para o nome do plano comprado
                });

                setTimeout(() => {
                    alert("PAGAMENTO RECEBIDO! O seu rendimento de 35% começará a ser processado agora.");
                    location.href = "dashboard.html";
                }, 2500);

            } catch (e) {
                alert("Erro no processamento: " + e.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-fingerprint"></i> TENTAR NOVAMENTE`;
            }
        };
    </script>
</body>
</html>
