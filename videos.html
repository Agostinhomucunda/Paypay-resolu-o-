<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vídeos Premiados | PayPay</title>
</head>
<body style="padding: 20px; padding-bottom: 100px;">

    <h2 style="text-align: center; margin-bottom: 20px; font-weight: 900;">ASSISTA E <span style="color: var(--paypay);">GANHE</span></h2>

    <div class="premium-card" style="padding: 10px; min-height: 230px;">
        <div id="player"></div>
    </div>

    <div class="premium-card" style="margin-top: 20px; text-align: center;">
        <p id="status-text" style="font-size: 14px; font-weight: 700; color: #ffce00;">Carregando vídeo...</p>
        <div id="timer-box" style="font-size: 24px; font-weight: 900; margin: 10px 0; display: none;">60s</div>
        <button id="btn-ganhar" class="btn-main" style="display: none; margin-top: 10px;">RECLAMAR 5 PONTOS</button>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var tempoRestante = 60;
        var timerInterval;

        // Lista de vídeos estáveis (IDs corrigidos)
        const listaVideos = ["ox5xPAdrTw4", "6Z_7fO2pD8A", "XU8L8I0fTms", "Y6h7A0P9-6s"];
        const videoSorteado = listaVideos[Math.floor(Math.random() * listaVideos.length)];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '230',
                width: '100%',
                videoId: videoSorteado,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0, // Usuário não pode pular
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('status-text').innerText = "Assista para ganhar pontos";
            document.getElementById('timer-box').style.display = "block";
        }

        function onPlayerStateChange(event) {
            // Se o vídeo estiver a tocar (playing)
            if (event.data == YT.PlayerState.PLAYING) {
                if (!timerInterval) {
                    startTimer();
                }
            } else {
                // Se pausar, o tempo para (evita trapaça)
                clearInterval(timerInterval);
                timerInterval = null;
                document.getElementById('status-text').innerText = "Vídeo pausado! Continue a ver.";
            }
        }

        function startTimer() {
            document.getElementById('status-text').innerText = "Validando visualização...";
            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer-box').innerText = tempoRestante + "s";

                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    finalizarVideo();
                }
            }, 1000);
        }

        function finalizarVideo() {
            document.getElementById('timer-box').style.display = "none";
            document.getElementById('status-text').innerText = "Parabéns! Visualização concluída.";
            document.getElementById('status-text').style.color = "#00c853";
            document.getElementById('btn-ganhar').style.display = "block";
        }
    </script>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import { doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        document.getElementById('btn-ganhar').onclick = async () => {
            const btn = document.getElementById('btn-ganhar');
            btn.disabled = true;
            btn.innerText = "CREDITANDO...";

            try {
                const userRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(userRef, {
                    pontos: increment(5) // Adiciona 5 pontos
                });
                alert("Sucesso! +5 Pontos adicionados.");
                location.href = "dashboard.html";
            } catch (e) {
                alert("Erro ao salvar pontos.");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
