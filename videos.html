<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vídeos Premiados</title>
</head>
<body style="padding: 20px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Assista e Ganhe</h2>
    
    <div class="premium-card" id="video-container" style="padding: 10px; min-height: 250px;">
        <div id="player-placeholder" style="text-align: center; padding-top: 80px; opacity: 0.5;">Carregando player...</div>
    </div>

    <script type="module">
        const videos = ["ox5xPAdrTw4", "6Z_7fO2pD8A", "XU8L8I0fTms", "Y6h7A0P9-6s"];
        const randomVid = videos[Math.floor(Math.random() * videos.length)];
        
        document.getElementById('video-container').innerHTML = `
            <iframe width="100%" height="250" 
                src="https://www.youtube.com/embed/${randomVid}?autoplay=1" 
                frameborder="0" allow="autoplay; encrypted-media" allowfullscreen 
                style="border-radius:20px;">
            </iframe>`;
    </script>
</body>
</html>
