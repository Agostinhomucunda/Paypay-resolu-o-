<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Vídeos Premiados | PayPay Ganha</title>
    <style>
        /* Estilo para o botão bloqueado */
        .btn-locked {
            background: #444 !important;
            color: #888 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
        }
        .btn-unlocked {
            background: var(--paypay) !important;
            color: #000 !important;
            cursor: pointer !important;
        }
    </style>
</head>
<body style="padding: 20px; padding-bottom: 50px;">

    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="font-weight: 900;">ASSISTA E <span style="color: var(--paypay);">GANHE</span></h2>
        <p id="status-txt" style="font-size: 12px; color: var(--africel);">O botão será ativado após o vídeo</p>
    </div>

    <div class="premium-card" style="padding: 5px; border-radius: 20px; overflow: hidden;">
        <div id="player"></div>
    </div>

    <div style="margin-top: 25px;">
        <button id="btn-ganhar" class="btn-main btn-locked" disabled>
            <i class="fa-solid fa-lock" id="icon-lock"></i> OBTER PONTOS
        </button>
        
        <button onclick="location.reload()" class="btn-main" style="margin-top: 15px; background: transparent; border: 1px solid var(--border); color: white;">
            VER OUTRO VÍDEO
        </button>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Converti os teus links para IDs de embed
        const idsVideos = [
            "MWs_YypD1U8", "KkgtQlMQ1So", "T4hKYKYQVJA", 
            "RSTJR3btrRU", "Obqp1dvoiWU", "kjhfXA6Q0pA", 
            "FqiQINRbkwI", "FESRGG8mLTo", "WpaiWYTErRo"
        ];
        const videoSorteado = idsVideos[Math.floor(Math.random() * idsVideos.length)];

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '230',
                width: '100%',
                videoId: videoSorteado,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // YT.PlayerState.ENDED é o código 0 (quando o vídeo termina)
            if (event.data == YT.PlayerState.ENDED) {
                ativarBotao();
            }
        }

        function ativarBotao() {
            const btn = document.getElementById('btn-ganhar');
            const icon = document.getElementById('icon-lock');
            const status = document.getElementById('status-txt');

            btn.disabled = false;
            btn.classList.remove('btn-locked');
            btn.classList.add('btn-unlocked');
            icon.className = "fa-solid fa-check-circle";
            status.innerText = "Vídeo concluído! Já podes resgatar.";
            status.style.color = "var(--paypay)";
        }
    </script>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import { doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        document.getElementById('btn-ganhar').onclick = async () => {
            const btn = document.getElementById('btn-ganhar');
            btn.disabled = true;
            btn.innerText = "PROCESSANDO...";

            try {
                const userRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(userRef, {
                    pontos: increment(5)
                });
                alert("Parabéns! +5 pontos adicionados.");
                window.location.href = "dashboard.html";
            } catch (e) {
                alert("Erro ao salvar: " + e.message);
                btn.disabled = false;
                btn.innerText = "OBTER PONTOS";
            }
        };
    </script>
</body>
</html>
