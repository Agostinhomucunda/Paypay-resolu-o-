<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Vídeos | PayPay Ganha</title>
</head>
<body style="padding: 20px;">

    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="font-weight: 900;">VÍDEOS <span style="color: var(--paypay);">UNITEL & AFRICEL</span></h2>
        <p style="font-size: 12px; opacity: 0.7;">Assista e ganhe 5 pontos por vídeo.</p>
    </div>

    <div class="premium-card" style="padding: 5px; overflow: hidden; border-radius: 20px;">
        <iframe id="video-frame" width="100%" height="250" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div style="margin-top: 20px;">
        <button id="proximo-vid" class="btn-main" style="background: var(--surface); color: white; border: 1px solid var(--border); margin-bottom: 15px;">
            <i class="fa-solid fa-forward"></i> VER OUTRO VÍDEO
        </button>
        
        <button id="reclamar-pontos" class="btn-main">
            <i class="fa-solid fa-coins"></i> RECLAMAR +5 PONTOS
        </button>
    </div>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import { doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // LISTA DE 10 LINKS DIRETOS (UNITEL, AFRICEL, PAYPAY)
        const listaDeVideos = [
            "https://www.youtube.com/embed/ox5xPAdrTw4", // Promo 1
            "https://www.youtube.com/embed/6Z_7fO2pD8A", // Africel 1
            "https://www.youtube.com/embed/XU8L8I0fTms", // Unitel 1
            "https://www.youtube.com/embed/Y6h7A0P9-6s", // PayPay 1
            "https://www.youtube.com/embed/3W_6I0S1qfE", // Tutorial
            "https://www.youtube.com/embed/v8vS87mK7E8", // Promo 2
            "https://www.youtube.com/embed/7X8L1_G1p8M", // Africel 2
            "https://www.youtube.com/embed/9X8L2_G2p9N", // Unitel 2
            "https://www.youtube.com/embed/8X8L3_G3p0O", // PayPay 2
            "https://www.youtube.com/embed/6X8L4_G4p1P"  // Extra
        ];

        let indexAtual = Math.floor(Math.random() * listaDeVideos.length);
        const frame = document.getElementById('video-frame');

        // Função para carregar o vídeo
        function carregarVideo() {
            frame.src = listaDeVideos[indexAtual];
        }

        // Mudar de vídeo
        document.getElementById('proximo-vid').onclick = () => {
            indexAtual = (indexAtual + 1) % listaDeVideos.length;
            carregarVideo();
        };

        // Reclamar Pontos
        document.getElementById('reclamar-pontos').onclick = async () => {
            const btn = document.getElementById('reclamar-pontos');
            btn.disabled = true;
            btn.innerText = "PROCESSANDO...";

            try {
                await updateDoc(doc(db, "users", auth.currentUser.uid), {
                    pontos: increment(5)
                });
                alert("Parabéns! +5 pontos adicionados.");
                location.href = "dashboard.html";
            } catch (e) {
                alert("Erro ao salvar pontos.");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-coins"></i> RECLAMAR +5 PONTOS';
            }
        };

        // Iniciar
        carregarVideo();
    </script>
</body>
</html>
